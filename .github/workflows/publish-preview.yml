name: Publish friend-testing preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-preview
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: '42340695728'
      SOURCE_SHA: 5c7a5b4a3f2cdc9698930abf74f6365136af5a7c
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify source and version of the successful Windows build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/muse-build.json"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/muse-build.json")); if(r.conclusion!=="success" || r.head_sha!==process.env.SOURCE_SHA || r.path!==".github/workflows/windows-build.yml") throw Error("Unexpected build source or status");'
          gh api "repos/$GH_REPO/contents/package.json?ref=$SOURCE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/source-package.json"
          VERSION=$(node -p 'require("./package.json").version')
          SOURCE_VERSION=$(node -p 'require(process.env.RUNNER_TEMP+"/source-package.json").version')
          test "$VERSION" = "$SOURCE_VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Download tested executable artifacts
        uses: actions/download-artifact@v5
        with:
          name: Muse-Desktop-Windows-unsigned
          path: release-assets
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Validate release files and create checksums
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/Muse-Desktop-Setup-$VERSION-x64.exe"
          test -f "release-assets/Muse-Desktop-Portable-$VERSION-x64.exe"
          test "$(find release-assets -type f | wc -l)" -eq 2
          cd release-assets
          sha256sum ./*.exe > SHA256SUMS.txt
      - name: Publish public pre-release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" --json tagName,isPrerelease,isDraft,assets > "$RUNNER_TEMP/muse-release.json" 2>/dev/null; then
            node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/muse-release.json")); if(r.tagName!=="v"+process.env.VERSION || !r.isPrerelease || r.isDraft || r.assets.length!==0) throw Error("Refusing to replace published assets");'
            TAG_SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            test "$TAG_SHA" = "$SOURCE_SHA"
            gh release upload "$TAG" release-assets/*.exe release-assets/SHA256SUMS.txt
          else
            gh release create "$TAG" release-assets/*.exe release-assets/SHA256SUMS.txt \
              --target "$SOURCE_SHA" \
              --title "Muse Desktop v$VERSION — Local tasks + optional Notion" \
              --notes-file "docs/releases/v$VERSION.md" \
              --prerelease
          fi
