name: Build Windows installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --foreground-scripts --ignore-scripts=false
      - name: Validate source
        run: |
          npm run check
          npm test
      - name: Build installer and portable app
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload unsigned Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Muse-Desktop-Windows-unsigned
          path: |
            dist/*.exe
          if-no-files-found: error
